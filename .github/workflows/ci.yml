name: TerraPulse CI (Frontend & Backend)

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Frontend CI: Lint, Typecheck, Formatting & Next.js Build
  # ============================================================
  frontend-ci:
    name: Frontend Quality & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Check TypeScript Types
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Cache Next.js Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**.[jt]s', 'frontend/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN || 'pk.eyJ1IjoicGxhY2Vob2xkZXIiLCJhIjoiY2xwbGFjZWhvbGRlciJ9.placeholder' }}
          NODE_ENV: production

      - name: Verify Build Output
        run: |
          if [ -d ".next" ]; then
            echo "✓ Next.js production build artifacts successfully generated."
          else
            echo "✗ Missing .next build directory!"
            exit 1
          fi

  # ============================================================
  # Backend CI: Python Syntax, Flake8 & FastAPI App Startup Check
  # ============================================================
  backend-ci:
    name: Backend Lint & FastAPI Startup Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Check Python Syntax & Undefined Names (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify FastAPI App Startup
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          JWT_SECRET: "ci-test-secret-key-terrapulse-2026"
        run: |
          python -c "from app.main import app; print('✓ FastAPI application initialized successfully without errors')"
